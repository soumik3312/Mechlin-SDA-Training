name: sda_training_app
description: SDA Training Flutter Application
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  provider: ^6.1.5+1
  dio: ^5.11.1
  http: ^1.6.0
  shared_preferences: ^2.5.6
  connectivity_plus: ^6.1.5
  flutter_local_notifications: ^22.3.2
  cached_network_image: ^4.0.3
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  logger: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/