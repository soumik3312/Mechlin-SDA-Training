name: Performance Testing

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  performance-test:
    name: Performance Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start application
        run: |
          npm start > /tmp/sda-training.log 2>&1 &
          sleep 30

      - name: Verify application health
        run: |
          curl -f http://localhost:3000/health

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: ./lighthouse.config.js
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Install Artillery
        run: npm install -g artillery

      - name: Run Artillery load testing
        run: |
          artillery run artillery.config.yml

      - name: Run K6 load testing
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/scripts" \
            grafana/k6 run /scripts/k6-load-test.js

      - name: Generate performance report
        run: |
          echo "Performance test completed"
          echo "Results are available in workflow artifacts"