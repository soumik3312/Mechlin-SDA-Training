name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test and Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: week4/day23/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Run JavaScript linting
        run: npm run lint

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r week4/day23/requirements.txt pytest

      - name: Check Python syntax
        run: |
          python -m compileall -q week4/day23/ai week4/day23/tests

      - name: Run automated tests
        run: npm test

      - name: Check JavaScript syntax
        run: node --check week4/day23/ai/web-ai-integration.js

      - name: Verify Python dependencies
        run: python -m pip check

      - name: Run npm security audit
        run: npm audit --audit-level=moderate

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README links
        run: echo "Checking documentation links..."

      - name: Validate markdown
        run: echo "Validating markdown files..."

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif