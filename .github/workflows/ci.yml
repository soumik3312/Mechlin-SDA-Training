name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test and Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Day 18 deliverables
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            ".github/workflows/ci.yml"
            ".github/workflows/ci-cd.yml"
            ".github/workflows/deploy-staging.yml"
            ".github/workflows/security.yml"
            ".github/workflows/performance.yml"
            ".github/workflows/monitoring.yml"
            ".zap/rules.tsv"
            "lighthouse.config.js"
            "artillery.config.yml"
            "k6-load-test.js"
            "week3/day18/docs/cicd-guide.md"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty file: $file"
              exit 1
            fi

            echo "PASS: $file"
          done

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --quiet \
            --target "$RUNNER_TEMP/pyyaml" PyYAML

          PYTHONPATH="$RUNNER_TEMP/pyyaml" python -c '
          from pathlib import Path
          import yaml

          files = sorted(Path(".github/workflows").glob("*.yml"))
          files.append(Path("artillery.config.yml"))

          for path in files:
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
              print(f"PASS: YAML syntax: {path}")
          '

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README links
        run: |
          echo "Checking documentation links..."

      - name: Validate markdown
        run: |
          echo "Validating markdown files..."

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'