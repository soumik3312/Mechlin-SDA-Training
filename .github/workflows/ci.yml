name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test and Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: week3/day19/SDATrainingApp/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: week3/day19/SDATrainingApp

      - name: Run linting
        run: npm exec -- eslint . --max-warnings=0
        working-directory: week3/day19/SDATrainingApp

      - name: Run type checking
        run: npm exec -- tsc --noEmit --pretty false
        working-directory: week3/day19/SDATrainingApp

      - name: Run tests
        run: npm test -- --runInBand
        working-directory: week3/day19/SDATrainingApp

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README links
        run: echo "Checking documentation links..."

      - name: Validate markdown
        run: echo "Validating markdown files..."

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          trivyignores: .trivyignore

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif