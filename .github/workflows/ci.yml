name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Code Quality and Testing
  test:
    name: Test and Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Run linting on changed JavaScript files
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
          echo "No comparison SHA available; running the configured lint command."
          npm run lint
        else
          mapfile -t CHANGED_JS < <(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "*.js" "*.cjs" "*.mjs" "*.jsx" | grep -v "^\.eslintrc\.cjs$" || true
          )
          if [ "${#CHANGED_JS[@]}" -gt 0 ]; then
            npx eslint "${CHANGED_JS[@]}"
          else
            echo "No JavaScript source changes; ESLint is not applicable to this PR."
          fi
        fi

    - name: Run tests (allow empty test suite)
      run: npm test -- --passWithNoTests

    - name: Run security audit
      run: npm audit --audit-level moderate

  # Documentation Check
  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check README links
      run: |
        # Check for broken links in README
        echo "Checking documentation links..."

    - name: Validate markdown
      run: |
        # Validate markdown syntax
        echo "Validating markdown files..."

  # Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
