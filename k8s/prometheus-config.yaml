apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sda-training
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets:
              - "localhost:9090"

      - job_name: "app"
        static_configs:
          - targets:
              - "sda-training-service:3000"
        metrics_path: "/metrics"
        scrape_interval: 5s

      - job_name: "mongodb"
        static_configs:
          - targets:
              - "mongodb-service:27017"

      - job_name: "postgresql"
        static_configs:
          - targets:
              - "postgresql-service:5432"

      - job_name: "redis"
        static_configs:
          - targets:
              - "redis-service:6379"