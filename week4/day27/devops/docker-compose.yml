services:
  backend:
    image: taskpilot-backend:day27

    build:
      context: ../backend
      dockerfile: Dockerfile

    restart: unless-stopped
    init: true
    stop_grace_period: 15s

    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "5000"

      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in devops/.env}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-7d}"

      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8080,http://127.0.0.1:8080}"

      AI_GATEWAY_URL: "${AI_GATEWAY_URL:-http://host.docker.internal:5003}"

      CAPSTONE_DATA_DIR: /app/data

    extra_hosts:
      - "host.docker.internal:host-gateway"

    expose:
      - "5000"

    volumes:
      - capstone-data:/app/data

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:5000/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: taskpilot-frontend:day27

    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api

    restart: unless-stopped
    init: true
    stop_grace_period: 10s

    ports:
      - "${APP_PORT:-8080}:8080"

    depends_on:
      backend:
        condition: service_healthy

    read_only: true

    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m,mode=1777
      - /var/run:rw,noexec,nosuid,size=16m,mode=1777
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  capstone-data:
    name: taskpilot-capstone-data