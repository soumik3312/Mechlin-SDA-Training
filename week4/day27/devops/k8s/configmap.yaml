apiVersion: v1
kind: ConfigMap
metadata:
  name: taskpilot-config
  namespace: taskpilot
data:
  NODE_ENV: "production"
  HOST: "0.0.0.0"
  PORT: "5000"
  JWT_EXPIRES_IN: "7d"

  FRONTEND_URL: "http://localhost:8080,http://127.0.0.1:8080"

  # For a local Docker Desktop Kubernetes cluster.
  # For another cluster, replace this with a reachable Day 26 gateway URL.
  AI_GATEWAY_URL: "http://host.docker.internal:5003"

  CAPSTONE_DATA_DIR: "/app/data"