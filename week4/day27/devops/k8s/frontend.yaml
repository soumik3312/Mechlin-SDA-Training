apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskpilot-frontend
  namespace: taskpilot
  labels:
    app.kubernetes.io/name: taskpilot-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: taskpilot-frontend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskpilot-frontend
        app.kubernetes.io/component: frontend

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: frontend
          image: taskpilot-frontend:day27
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp

      volumes:
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 16Mi
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: taskpilot-frontend
  namespace: taskpilot
  labels:
    app.kubernetes.io/name: taskpilot-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taskpilot-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP