apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskpilot-backend
  namespace: taskpilot
  labels:
    app.kubernetes.io/name: taskpilot-backend
    app.kubernetes.io/component: backend
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: taskpilot-backend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskpilot-backend
        app.kubernetes.io/component: backend

    spec:
      terminationGracePeriodSeconds: 15

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: taskpilot-backend:day27
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: taskpilot-config

          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: taskpilot-secrets
                  key: JWT_SECRET

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: backend-data
              mountPath: /app/data

      volumes:
        - name: backend-data
          persistentVolumeClaim:
            claimName: taskpilot-backend-data

---
apiVersion: v1
kind: Service
metadata:
  # This name intentionally matches the Nginx upstream in default.conf.
  name: backend
  namespace: taskpilot
  labels:
    app.kubernetes.io/name: taskpilot-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taskpilot-backend
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP